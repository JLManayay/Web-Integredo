spring:
  application:
    name: fitsync-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fitsync
    username: fitsync
    password: fitsync

  jpa:
    hibernate:
      # validate: las tablas las crea Flyway, no Hibernate
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
