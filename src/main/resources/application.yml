spring:
  application:
    name: fitsync-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/fitsync
    username: fitsync
    password: fitsync

  jpa:
    hibernate:
      # validate: las tablas las crea Flyway, no Hibernate
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 8082 para poder correr esta versión al mismo tiempo que la original (8081)
  port: 8082

fitsync:
  zona-horaria: America/Lima
