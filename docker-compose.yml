# Levanta solo PostgreSQL, con las mismas credenciales de application.yml.
# Usa su propio contenedor y el puerto 5433 para no mezclarse con la base del proyecto original.
# Uso:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: fitsync-avaproy-db
    environment:
      POSTGRES_DB: fitsync
      POSTGRES_USER: fitsync
      POSTGRES_PASSWORD: fitsync
    ports:
      - "5433:5432"
    volumes:
      - fitsync-avaproy-data:/var/lib/postgresql/data
volumes:
  fitsync-avaproy-data:
